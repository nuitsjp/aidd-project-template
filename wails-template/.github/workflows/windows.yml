name: Windows checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.paths.outputs.matrix }}
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed applications
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              directories = ['.', 'reference']
          else:
              base = os.environ['BASE_SHA']
              head = os.environ['HEAD_SHA']
              if base == '0' * 40:
                  command = ['git', 'ls-tree', '-r', '--name-only', '-z', head]
              elif os.environ['EVENT_NAME'] == 'pull_request':
                  command = ['git', 'diff', '--name-only', '--no-renames', '-z', f'{base}...{head}']
              else:
                  command = ['git', 'diff', '--name-only', '--no-renames', '-z', base, head]
              paths = subprocess.check_output(command).decode('utf-8').split('\0')
              paths = [path for path in paths if path]
              shared_paths = {
                  '.github/workflows/windows.yml',
                  'scripts/doc_check.py',
                  'docs/document-policy.md',
                  'LICENSE',
              }
              shared = any(path in shared_paths or path.startswith('docs/standards/') for path in paths)
              directories = []
              if shared or any(not path.startswith('reference/') for path in paths):
                  directories.append('.')
              if shared or any(path.startswith('reference/') for path in paths):
                  directories.append('reference')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'matrix={json.dumps({"directory": directories})}\n')
              output.write(f'changed={str(bool(directories)).lower()}\n')
          print(f'Selected applications: {directories}')
          PY
  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.5'
          working_directory: ${{ matrix.directory }}
      - run: mise trust
      - name: Read cache paths and tool versions
        id: cache-paths
        run: |
          "gomod=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT
          "gobuild=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT
          "go=$(go env GOVERSION)" >> $env:GITHUB_OUTPUT
          $wails = [regex]::Match((Get-Content go.mod -Raw), 'github.com/wailsapp/wails/v3 (\S+)').Groups[1].Value
          "wails=$wails" >> $env:GITHUB_OUTPUT
      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.cache-paths.outputs.gomod }}
            ${{ steps.cache-paths.outputs.gobuild }}
          key: ${{ runner.os }}-go-${{ steps.cache-paths.outputs.go }}-${{ hashFiles(format('{0}/go.sum', matrix.directory)) }}
          restore-keys: ${{ runner.os }}-go-${{ steps.cache-paths.outputs.go }}-
      - name: Wails CLI cache
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.directory }}/.tools/wails3.exe
          key: ${{ runner.os }}-wails-${{ steps.cache-paths.outputs.go }}-${{ steps.cache-paths.outputs.wails }}
      - name: Wails CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: node scripts/run.mjs cli:install
      - name: Dependencies
        run: node scripts/run.mjs setup:dependencies
      - name: Browser
        run: mise run setup:browser
      - name: Verify and build
        run: node scripts/run.mjs ci
      - name: NSIS
        run: choco install nsis --yes --no-progress
      - name: Installer
        run: node scripts/run.mjs package:prepared
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.directory == '.' && 'project' || 'reference' }}
          path: ${{ matrix.directory }}/bin/*-setup.exe
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-${{ matrix.directory == '.' && 'project' || 'reference' }}
          path: |
            ${{ matrix.directory }}/frontend/playwright-report/
            ${{ matrix.directory }}/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
