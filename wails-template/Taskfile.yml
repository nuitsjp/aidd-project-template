version: '3'

tasks:
  generate:
    cmds:
      - wails3 generate bindings -ts -i -names -f '-tags=server' -d frontend/bindings .
      - cmd: npm run routes
        dir: frontend
  frontend:dev:
    dir: frontend
    cmds: [npm run dev]
  build:dev:
    cmds:
      - task: generate
      - cmd: npm run build:dev
        dir: frontend
      - node scripts/build.mjs desktop-dev
  run:
    cmds: [node scripts/build.mjs run]
  build:
    cmds:
      - task: generate
      - cmd: npm run build
        dir: frontend
      - node scripts/build.mjs desktop
  build:server:
    cmds:
      - task: generate
      - cmd: npm run build
        dir: frontend
      - node scripts/build.mjs server
  server:
    cmds:
      - task: build:server
      - node scripts/build.mjs run-server
  package:
    cmds:
      - task: build
      - node scripts/build.mjs package
  test:core:
    cmds: [go test ./internal/... ./cmd/release/...]
  verify:
    cmds:
      - task: generate
      - cmd: npm run typecheck
        dir: frontend
      - cmd: npm run lint
        dir: frontend
      - cmd: npm run test
        dir: frontend
      - go test ./internal/... ./cmd/release/...
      - go vet -tags server ./...
      - python scripts/doc_check.py .
      - task: build:server
      - cmd: npm run test:e2e
        dir: frontend
