version: '3'

vars:
  # 生成先の reference/ は親ディレクトリの共通検査器を使う。
  DOC_CHECK: '{{if eq (osBase .ROOT_DIR) "reference"}}../{{end}}scripts/doc_check.py'

tasks:
  generate:
    run: once
    cmds:
      - wails3 generate bindings -ts -i -names -f '-tags=server' -d frontend/bindings .
      - npm --prefix frontend run routes
  frontend:build:
    run: once
    cmds:
      - task: generate
      - npm --prefix frontend run build:prepared
  frontend:dev:
    dir: frontend
    cmds: [npm run dev]
  build:dev:
    cmds:
      - task: generate
      - npm --prefix frontend run build:dev
      - node scripts/build.mjs desktop-dev
  run:
    cmds: [node scripts/build.mjs run]
  build:
    cmds:
      - task: frontend:build
      - node scripts/build.mjs desktop
  build:server:
    cmds:
      - task: frontend:build
      - node scripts/build.mjs server
  server:
    cmds:
      - task: build:server
      - node scripts/build.mjs run-server
  package:
    cmds:
      - task: build
      - task: package:prepared
  package:prepared:
    cmds:
      - node scripts/build.mjs package
  ci:
    cmds:
      - task: verify:prepare
      - task: ci:finish
  ci:finish:
    deps: [test:e2e, build]
  test:core:
    cmds: [go test ./internal/... ./cmd/release/...]
  lint:
    deps: [lint:frontend, lint:scripts, check:workflow]
  lint:frontend:
    cmds: [npm --prefix frontend run lint]
  lint:scripts:
    cmds: [npm --prefix frontend run lint:scripts]
  check:workflow:
    cmds: [node scripts/run.mjs check:workflow]
  lint:go:
    cmds:
      - task: frontend:build
      - task: lint:go:prepared
  lint:go:prepared:
    cmds: [node scripts/run.mjs lint:go:prepared]
  audit:
    cmds:
      - task: frontend:build
      - node scripts/run.mjs audit:dependencies
  format:
    cmds:
      - node scripts/run.mjs format:go
      - npm --prefix frontend run format
  format:check:
    cmds:
      - node scripts/run.mjs format:go:check
      - npm --prefix frontend run format:check
  test:frontend:
    cmds: [npm --prefix frontend run test]
  check:docs:
    cmds:
      - python {{.DOC_CHECK}} .
  test:e2e:
    cmds: [npm --prefix frontend run test:e2e]
  verify:prepare:
    cmds:
      - task: generate
      - task: verify:prepared
  verify:prepared:
    deps: [frontend:build, lint, format:check, test:frontend, test:core, check:docs]
    cmds:
      - task: verify:go:prepared
      - task: build:server
  verify:go:prepared:
    deps: [vet:go:prepared, lint:go:prepared]
  vet:go:prepared:
    cmds:
      - go vet -tags production . ./internal/... ./cmd/...
      - go vet -tags server,production . ./internal/... ./cmd/...
  verify:
    cmds:
      - task: verify:prepare
      - task: test:e2e
