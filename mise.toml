[tools]
node = "24.21.0"
python = "3.13.15"
actionlint = "1.7.12"

[env]
PYTHONIOENCODING = "utf-8"

[tasks.setup]
description = "配布元の静的検査ツールとnpm依存を導入する"
run = ["mise install", "npm ci --no-audit --no-fund"]

[tasks.verify]
description = "配布元スクリプト・全workflow・文書・生成処理を検査する"
run = ["npm run lint", "node scripts/check-workflows.mjs", "python template/scripts/doc_check.py template", "python -m unittest discover -s tests"]

[tasks.audit]
description = "配布元のnpm依存にある既知脆弱性を検査する"
run = "npm audit --audit-level=low"

[tasks."init:wails"]
description = "共通テンプレートとWails差分を新しいディレクトリへ配置する"
run = "node scripts/init-template.mjs wails"

[tasks."init:react"]
description = "共通テンプレートとReact差分を新しいディレクトリへ配置する"
run = "node scripts/init-template.mjs react"

[tasks."init:react-dotnet"]
description = "共通テンプレートとReact・.NET差分を新しいディレクトリへ配置する"
run = "node scripts/init-template.mjs react-dotnet"

[tasks."update:common"]
description = "採用先の共通資材7件（標準・検査・文書スキル）を固定コミット間で更新する"
run = "node scripts/update-common.mjs"
