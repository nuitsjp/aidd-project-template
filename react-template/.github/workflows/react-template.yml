name: React template
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        directory: [., reference]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      CI: 'true'
      E2E_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.directory }}/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies and generate routes
        run: npm run setup
      - name: Install Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install --only-shell chromium
      - name: Typecheck, lint, documents, tests, build and real E2E
        run: npm run verify
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-e2e-${{ matrix.os }}-${{ matrix.directory == '.' && 'project' || 'reference' }}
          path: |
            ${{ matrix.directory }}/playwright-report/
            ${{ matrix.directory }}/.e2e-results/
          if-no-files-found: ignore
          retention-days: 7
